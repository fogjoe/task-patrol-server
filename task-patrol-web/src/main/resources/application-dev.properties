# Development environment settings
server.port=8080
# Database with local fallbacks for convenience
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/shadow_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Print SQL logs to the console to help with debugging
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
