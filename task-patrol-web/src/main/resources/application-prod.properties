# Production environment settings
server.port=8080
# Database with strict environment variables (no fallbacks allowed)
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/shadow_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# SQL logging is intentionally omitted here to save server memory and CPU